<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 多 Agent 组织看板</title>
<script>
  // 首帧前定主题, 避免闪烁: 深链 ?theme=light 优先, 其次 localStorage, 默认暗色
  // 状态色变量(--c-*)供画布 CSS 使用; antd 挂载后接管页面其余部分
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("tb-theme");
    var dark = !(t === "light");
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var P = dark
      ? { run: "#22d3ee", block: "#f87171", review: "#fbbf24", ready: "#a3e635", todo: "#94a3b8", triage: "#c084fc", done: "#546079", chief: "#60a5fa", stale: "#fb923c", spark: "#e0faff", blue2: "#60a5fa", dot: "#18234a", bg: "#0a0f1e" }
      : { run: "#0891b2", block: "#dc2626", review: "#b45309", ready: "#4d7c0f", todo: "#64748b", triage: "#7e22ce", done: "#94a3b8", chief: "#2563eb", stale: "#c2410c", spark: "#0e7490", blue2: "#2563eb", dot: "#c9d4e8", bg: "#f5f5f5" };
    for (var k in P) {
      if (k === "bg") document.documentElement.style.setProperty("--tb-bg", P[k]);
      else document.documentElement.style.setProperty("--c-" + k, P[k]);
    }
    var S = dark
      ? { nA: "#141f3d", nB: "#0f1730", cA: "#16234a", cB: "#101a38", zoomBg: "rgba(13,20,40,.85)", asideBg: "rgba(13,20,40,.5)", sh: "#000000aa", shSoft: "#00000066", userFg: "#93c5fd" }
      : { nA: "#ffffff", nB: "#f3f6fc", cA: "#eef4ff", cB: "#e6eefc", zoomBg: "rgba(255,255,255,.88)", asideBg: "rgba(246,248,252,.65)", sh: "#1e293b33", shSoft: "#1e293b22", userFg: "#1d4ed8" };
    document.documentElement.style.setProperty("--n-a", S.nA);
    document.documentElement.style.setProperty("--n-b", S.nB);
    document.documentElement.style.setProperty("--c-a", S.cA);
    document.documentElement.style.setProperty("--c-b", S.cB);
    document.documentElement.style.setProperty("--zoom-bg", S.zoomBg);
    document.documentElement.style.setProperty("--aside-bg", S.asideBg);
    document.documentElement.style.setProperty("--pop-shadow", S.sh);
    document.documentElement.style.setProperty("--pop-shadow-soft", S.shSoft);
    document.documentElement.style.setProperty("--user-fg", S.userFg);
  } catch (e) {}
</script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--tb-bg, #0a0f1e); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
