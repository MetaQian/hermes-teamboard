services:
  teamboard:
    build: .
    image: hermes-teamboard:latest
    container_name: hermes-teamboard
    ports:
      - "8787:8787"
    # 方式一(推荐): 挂载宿主机 config.json, 密码留在本机,
    #   UI 里「保存并连接」也会写回这个文件(可持久化)。
    volumes:
      - ./config.json:/app/config.json
    # 方式二: 用环境变量(优先级高于 config.json, 适合把地址等注入容器)。
    # environment:
    #   HERMES_BASE_URL: http://192.18.18.200:9117
    #   HERMES_USERNAME: admin
    #   HERMES_PASSWORD: "********"
    #   HERMES_REFRESH_MS: "10000"
    restart: unless-stopped